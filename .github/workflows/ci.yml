name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.3.10'
      - name: Check source and tool versions
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 Scripts/verify-source.py
          python3 Scripts/test-preview-release.py
          python3 Scripts/test-ui-render-artifacts.py
          xcodebuild -version
          xcodebuild -help > XcodeHelp.txt 2>&1
          grep -F -- '-testLanguage' XcodeHelp.txt
          grep -F -- '-testRegion' XcodeHelp.txt
          swift --version
          test "$(tuist version)" = '4.148.3'
      - name: Generate Xcode workspace
        run: tuist generate --no-open
      - name: Build app and tests, then run the built tests
        run: |
          set -euo pipefail
          args=(-workspace MoeKit.xcworkspace -scheme MoeKit -configuration Debug
                -destination 'platform=macOS' -derivedDataPath DerivedData
                CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          xcodebuild "${args[@]}" build-for-testing
          xcodebuild "${args[@]}" test-without-building -testLanguage en -testRegion US -resultBundlePath TestResults.xcresult
      - name: Render Projects and Tasks in Simplified Chinese
        run: |
          set -euo pipefail
          xcodebuild -workspace MoeKit.xcworkspace -scheme MoeKit -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test-without-building -testLanguage zh-Hans -testRegion CN \
            -only-testing:MoeKitTests/UISnapshotTests/testDemoProjectsRenders \
            -only-testing:MoeKitTests/UISnapshotTests/testDemoTasksRenders \
            -resultBundlePath ChineseRenderResults.xcresult
      - name: Check SwiftUI bundle and smoke-launch explicit demo
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          import subprocess

          app = Path("DerivedData/Build/Products/Debug/MoeKit.app").resolve()
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "com.yusixian.MoeKit"
          assert info["CFBundleExecutable"] == "MoeKit"
          assert info["CFBundlePackageType"] == "APPL"
          assert info["LSMinimumSystemVersion"] == "15.0"
          assert "NSMainStoryboardFile" not in info and "NSMainNibFile" not in info
          environment = {key: value for key, value in os.environ.items() if key in
                         {"PATH", "HOME", "TMPDIR", "USER", "LOGNAME", "LANG", "LC_ALL",
                          "LC_CTYPE", "__CF_USER_TEXT_ENCODING"}}
          process = subprocess.Popen([str(app / "Contents/MacOS/MoeKit"), "--demo"],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                     env=environment)
          try:
              try:
                  code = process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  print("Explicit demo launch stayed alive for 10 seconds on the runner architecture.")
                  print("This is a liveness check, not visual, accessibility, or user-Mac acceptance.")
              else:
                  raise SystemExit(f"Demo app exited before the smoke interval (exit code {code}).")
          finally:
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY
      - name: Export owned-view render evidence
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path UIRenderArtifacts
            python3 Scripts/verify-ui-render-artifacts.py UIRenderArtifacts en
          fi
          if [ -d ChineseRenderResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ChineseRenderResults.xcresult --output-path ChineseUIRenderArtifacts
            python3 Scripts/verify-ui-render-artifacts.py ChineseUIRenderArtifacts zh-Hans
          fi
      - name: Preserve owned-view render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-view-renders-${{ env.SOURCE_SHA }}
          path: UIRenderArtifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Chinese owned-view render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-chinese-view-renders-${{ env.SOURCE_SHA }}
          path: ChineseUIRenderArtifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-results-${{ env.SOURCE_SHA }}
          path: |
            TestResults.xcresult
            ChineseRenderResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  release-tests:
    name: Release tests (${{ matrix.instrumentation }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        instrumentation: [none, address-sanitizer]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      INSTRUMENTATION: ${{ matrix.instrumentation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.3.10'
      - name: Verify exact source and generate workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tuist version)" = '4.148.3'
          xcodebuild -version
          swift --version
          tuist generate --no-open
      - name: Build and test optimized Release without signing secrets
        run: |
          set -euo pipefail
          args=(-workspace MoeKit.xcworkspace -scheme MoeKit -configuration Release
                -destination 'platform=macOS' -derivedDataPath DerivedDataRelease
                ENABLE_TESTABILITY=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          test_args=(test-without-building -testLanguage en -testRegion US -resultBundlePath ReleaseTestResults.xcresult)
          if [ "$INSTRUMENTATION" = address-sanitizer ]; then
            args+=(-enableAddressSanitizer YES)
            test_args+=(-only-testing:MoeKitTests/CatalogPersistenceTests
                        -only-testing:MoeKitTests/WorkspacePersistenceTests
                        -only-testing:MoeKitTests/CatalogRecoveryLifetimeTests)
          fi
          xcodebuild -project MoeKit.xcodeproj -alltargets -configuration Release \
            ENABLE_TESTABILITY=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -showBuildSettings -json > ReleaseBuildSettings.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          settings = json.loads(Path("ReleaseBuildSettings.json").read_text())
          levels = {entry["target"]: entry["buildSettings"].get("SWIFT_OPTIMIZATION_LEVEL") for entry in settings}
          required = ("MoeKit", "MoeKitTests")
          if any(levels.get(target) not in {"-O", "-Osize"} for target in required):
              raise SystemExit(f"Release app and tests must stay optimized: {levels}")
          print(f"Verified Release optimization levels: {levels}")
          PY
          xcodebuild "${args[@]}" build-for-testing
          xcodebuild "${args[@]}" "${test_args[@]}"
          xcrun xcresulttool get test-results summary --path ReleaseTestResults.xcresult > ReleaseTestSummary.json
          xcrun xcresulttool get test-results tests --path ReleaseTestResults.xcresult > ReleaseTestInventory.json
          python3 - <<'PYTHON'
          from pathlib import Path
          import json
          summary = json.loads(Path("ReleaseTestSummary.json").read_text())
          inventory = Path("ReleaseTestInventory.json").read_text()
          json.loads(inventory)
          required = ("CatalogPersistenceTests", "WorkspacePersistenceTests", "CatalogRecoveryLifetimeTests")
          if summary.get("passedTests", 0) < 17 or summary.get("failedTests") != 0 or summary.get("skippedTests") != 0:
              raise SystemExit(f"Optimized catalog tests must execute and pass without skips: {summary}")
          if any(suite not in inventory for suite in required):
              raise SystemExit("An expected catalog suite is absent from the executed test inventory")
          print(f"Verified executed optimized suites: {required}; passed: {summary['passedTests']}")
          PYTHON
      - name: Preserve optimized test results and build settings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results-${{ matrix.instrumentation }}-${{ env.SOURCE_SHA }}
          path: |
            ReleaseTestResults.xcresult
            ReleaseBuildSettings.json
            ReleaseTestSummary.json
            ReleaseTestInventory.json
          if-no-files-found: ignore
          retention-days: 14
