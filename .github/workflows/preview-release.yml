name: Signed preview release

# Merge/review this workflow on the default branch before manually dispatching it.
# Never add pull_request, pull_request_target, tag-push, or workflow_run triggers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version with canonical Markdown notes, e.g. 0.1.0-preview.2 (without v)'
        required: true
        type: string
      source_sha:
        description: 'Reviewed full 40-character SHA; must match the selected default-branch HEAD'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: moekit-signed-preview-release
  cancel-in-progress: false

env:
  PREVIEW_VERSION: ${{ inputs.version }}
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build-and-test:
    if: github.repository == 'cosZone/MoeKit' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate dispatch and exact reviewed source
        run: python3 Scripts/preview-release.py validate
      - name: Test release safety helpers
        run: python3 Scripts/test-preview-release.py
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.3.10'
          cache: false
      - name: Check source and pinned tools, then generate workspace
        run: |
          set -euo pipefail
          python3 Scripts/verify-source.py
          test "$(tuist version)" = '4.148.3'
          xcodebuild -version
          tuist generate --no-open
      - name: Prepare official Mole synthetic fixture without signing secrets
        run: |
          python3 Scripts/prepare-mole-ci-fixture.py
          tuist generate --no-open
      - name: Build and run Release-configuration unit tests without signing secrets
        run: |
          set -euo pipefail
          args=(-workspace MoeKit.xcworkspace -scheme MoeKit -configuration Release
                -destination 'platform=macOS' -derivedDataPath DerivedDataTests
                ENABLE_TESTABILITY=YES CODE_SIGN_STYLE=Manual
                CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          xcodebuild "${args[@]}" build-for-testing
          xcodebuild "${args[@]}" test-without-building -resultBundlePath TestResults.xcresult
      - name: Archive unsigned universal Release from the tested source
        run: |
          set -euo pipefail
          version="${PREVIEW_VERSION%%-preview.*}"
          xcodebuild archive -workspace MoeKit.xcworkspace -scheme MoeKit \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedDataArchive -archivePath build/MoeKit.xcarchive \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            "MARKETING_VERSION=$version" "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
          python3 Scripts/preview-release.py prepare
      - name: Transfer only the unsigned app and provenance to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            Unsigned/MoeKit-unsigned.zip
            Unsigned/BUILD_INFO.json
            Unsigned/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve test results from the secret-free job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  sign:
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate exact source before secrets become available
        run: python3 Scripts/preview-release.py validate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: Unsigned
      - name: Sign with one Apple Development identity in an ephemeral keychain
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: python3 Scripts/preview-release.py sign
      - name: Always remove temporary signing material
        if: always()
        run: python3 Scripts/preview-release.py cleanup
      - name: Upload only the verified DMG and ZIP, checksums, and safe provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            Preview/MoeKit-v${{ inputs.version }}-macOS.dmg
            Preview/MoeKit-v${{ inputs.version }}-macOS.zip
            Preview/SHA256SUMS.txt
            Preview/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate exact source before publication
        run: python3 Scripts/preview-release.py validate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: Preview
      - name: Verify, create the exact tag, and publish a new prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/preview-release.py publish
