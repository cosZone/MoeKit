name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-idle-probe:
    name: Native idle-use evidence (positive or verified refusal)
    runs-on: macos-15-intel
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MOEKIT_INSTALLER_IDLE_PROBE: '1'
      MOEKIT_INSTALLER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MOEKIT_INSTALLER_EVIDENCE_DIR: ${{ github.workspace }}/InstallerIdleEvidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify actual current eligibility or explicit source-bound unsupported evidence
        run: python3 Scripts/run-installer-idle-probe.py
      - name: Preserve exact-commit idle-use proof and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-idle-use-${{ env.SOURCE_SHA }}
          path: |
            InstallerIdleEvidence/
            InstallerIdleProbe.log
            InstallerIdleInvocation.json
          if-no-files-found: ignore
          retention-days: 14

  universal-archive:
    name: Unsigned universal archive
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.3.10'
      - name: Generate the exact source with pinned tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tuist version)" = '4.148.3'
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.4'
          tuist generate --no-open
      - name: Archive both architectures with script sandboxing enabled
        run: |
          set -euo pipefail
          args=(archive -workspace MoeKit.xcworkspace -scheme MoeKit
                -configuration Release -destination 'generic/platform=macOS'
                -derivedDataPath DerivedDataArchive -archivePath build/MoeKit.xcarchive
                'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
                CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
                MARKETING_VERSION=0.1.0 CURRENT_PROJECT_VERSION=1)
          xcodebuild "${args[@]}" -showBuildSettings -json > ArchiveBuildSettings.json
          xcodebuild "${args[@]}" | tee ArchiveBuild.log
      - name: Verify the archive layout with the release validator
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee ArchiveVerification.json
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("preview_release", "Scripts/preview-release.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          settings = json.loads(Path("ArchiveBuildSettings.json").read_text())
          app_settings = next(entry["buildSettings"] for entry in settings if entry["target"] == "MoeKit")
          release.require(app_settings.get("ENABLE_USER_SCRIPT_SANDBOXING") == "YES",
                          "The archive must preserve script sandboxing.")
          release.require(app_settings.get("CODE_SIGNING_ALLOWED") == "NO",
                          "This archive gate must not sign with a certificate.")
          release.require(app_settings.get("DEPLOYMENT_LOCATION") == "YES" and
                          app_settings.get("MOLE_SUPERVISOR_SOURCE_DIR") ==
                          str(Path(app_settings["UNINSTALLED_PRODUCTS_DIR"]) / app_settings["PLATFORM_NAME"]) and
                          app_settings.get("GIT_INSPECTOR_SOURCE_DIR") ==
                          str(Path(app_settings["UNINSTALLED_PRODUCTS_DIR"]) / app_settings["PLATFORM_NAME"]),
                          "The archive must declare the exact physical helper inputs.")
          app = Path("build/MoeKit.xcarchive/Products/Applications/MoeKit.app")
          release.require(set(app.parent.iterdir()) == {app} and
                          set(app.parent.parent.iterdir()) == {app.parent},
                          "The archive must install only MoeKit.app.")
          release.verify_app(app, {"marketing_version": "0.1.0", "run_number": "1"}, provenance=False)
          print(json.dumps({"source_sha": os.environ["SOURCE_SHA"],
                            "script_sandboxing": True,
                            "architectures_per_code_object": list(release.ARCHITECTURES),
                            "code_objects": {path: hashlib.sha256((app / path).read_bytes()).hexdigest()
                                             for path in sorted(release.EXECUTABLE_PATHS)},
                            "scope": "Unsigned archive layout only; no certificate, launch or publication."}, indent=2))
          PY
          git diff --exit-code HEAD --
      - name: Preserve archive diagnostics without distributing the unsigned app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-archive-check-${{ env.SOURCE_SHA }}
          path: |
            ArchiveBuild.log
            ArchiveBuildSettings.json
            ArchiveVerification.json
          if-no-files-found: ignore
          retention-days: 14

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TEST_RUNNER_MOEKIT_INSTALLER_MOUNT_FIXTURE: '1'
      TEST_RUNNER_MOEKIT_INSTALLER_TRASH_FIXTURE: '1'
      TEST_RUNNER_MOEKIT_GIT_NATIVE_FIXTURE: '1'
      TEST_RUNNER_GITHUB_ACTIONS: 'true'
      TEST_RUNNER_RUNNER_ENVIRONMENT: github-hosted
      TEST_RUNNER_MOEKIT_INSTALLER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_RUNNER_MOEKIT_INSTALLER_EVIDENCE_DIR: ${{ github.workspace }}/InstallerFixtureEvidence
      TEST_RUNNER_MOEKIT_PROCESS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_RUNNER_MOEKIT_PROCESS_EVIDENCE_DIR: ${{ github.workspace }}/ProcessFixtureEvidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.3.10'
      - name: Check source and tool versions
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 Scripts/verify-source.py
          python3 Scripts/test-preview-release.py
          python3 Scripts/test-ui-render-artifacts.py
          python3 Scripts/test-mole-supervisor.py
          python3 Scripts/test-git-object-inspector.py
          python3 Scripts/test-installer-fixture-evidence.py
          python3 Scripts/test-installer-conditional-evidence.py
          python3 Scripts/test-process-fixture-evidence.py
          xcodebuild -version
          xcodebuild -help > XcodeHelp.txt 2>&1
          grep -F -- '-testLanguage' XcodeHelp.txt
          grep -F -- '-testRegion' XcodeHelp.txt
          swift --version
          test "$(tuist version)" = '4.148.3'
      - name: Verify native catalog writer concurrency
        run: |
          set -euo pipefail
          python3 Scripts/test-catalog-concurrency.py --configuration debug | tee CatalogConcurrencyResults.txt
      - name: Prepare pinned Mole analyzer for synthetic fixture tests
        run: python3 Scripts/prepare-mole-ci-fixture.py
      - name: Generate Xcode workspace
        run: tuist generate --no-open
      - name: Build app and tests, then run the built tests
        run: |
          set -euo pipefail
          args=(-workspace MoeKit.xcworkspace -scheme MoeKit -configuration Debug
                -destination 'platform=macOS' -derivedDataPath DerivedData
                CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          mkdir -m 700 InstallerFixtureEvidence ProcessFixtureEvidence
          xcodebuild "${args[@]}" build-for-testing
          xcodebuild "${args[@]}" test-without-building -testLanguage en -testRegion US -resultBundlePath TestResults.xcresult \
            '-skip-testing:MoeKitTests/InstallerUseEvidenceTests/nativeIdleCurrentUserCoverage()'
          python3 Scripts/verify-process-fixture-evidence.py --directory ProcessFixtureEvidence --source-sha "$SOURCE_SHA"
      - name: Verify affirmative native installer fixture evidence
        run: python3 Scripts/verify-installer-fixture-evidence.py --directory InstallerFixtureEvidence --source-sha "$SOURCE_SHA" --kinds native-trash mounted-image live-mole
      - name: Render workspaces and first-use guidance in Simplified Chinese
        run: |
          set -euo pipefail
          xcodebuild -workspace MoeKit.xcworkspace -scheme MoeKit -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test-without-building -testLanguage zh-Hans -testRegion CN \
            -only-testing:MoeKitTests/UISnapshotTests/testDemoProjectsRenders \
            -only-testing:MoeKitTests/UISnapshotTests/testDemoTasksRenders \
            -only-testing:MoeKitTests/UISnapshotTests/testGettingStartedWelcomeRenders \
            -only-testing:MoeKitTests/UISnapshotTests/testGettingStartedDestinationsRender \
            -only-testing:MoeKitTests/UISnapshotTests/testFirstUseWorkspacesRender \
            -only-testing:MoeKitTests/UISnapshotTests/testSettingsModeGuidanceRenders \
            -only-testing:MoeKitTests/ToolPreparationViewTests/testToolPreparationRenders \
            -only-testing:MoeKitTests/MoleAnalysisViewTests/testAnalysisSheetRenders \
            -only-testing:MoeKitTests/InstallerTrashViewTests/testInstallerConfirmationRenders \
            -only-testing:MoeKitTests/ProcessStopViewTests/testStopConfirmationRenders \
            -resultBundlePath ChineseRenderResults.xcresult
      - name: Check SwiftUI bundle and smoke-launch explicit demo
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          import subprocess

          app = Path("DerivedData/Build/Products/Debug/MoeKit.app").resolve()
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "com.yusixian.MoeKit"
          assert info["CFBundleExecutable"] == "MoeKit"
          assert info["CFBundlePackageType"] == "APPL"
          assert info["LSMinimumSystemVersion"] == "15.0"
          assert "NSMainStoryboardFile" not in info and "NSMainNibFile" not in info
          environment = {key: value for key, value in os.environ.items() if key in
                         {"PATH", "HOME", "TMPDIR", "USER", "LOGNAME", "LANG", "LC_ALL",
                          "LC_CTYPE", "__CF_USER_TEXT_ENCODING"}}
          process = subprocess.Popen([str(app / "Contents/MacOS/MoeKit"), "--demo"],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                     env=environment)
          try:
              try:
                  code = process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  print("Explicit demo launch stayed alive for 10 seconds on the runner architecture.")
                  print("This is a liveness check, not visual, accessibility, or user-Mac acceptance.")
              else:
                  raise SystemExit(f"Demo app exited before the smoke interval (exit code {code}).")
          finally:
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY
      - name: Export owned-view render evidence
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path UIRenderArtifacts
            python3 Scripts/verify-ui-render-artifacts.py UIRenderArtifacts en
          fi
          if [ -d ChineseRenderResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ChineseRenderResults.xcresult --output-path ChineseUIRenderArtifacts
            python3 Scripts/verify-ui-render-artifacts.py ChineseUIRenderArtifacts zh-Hans
          fi
      - name: Preserve owned-view render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-view-renders-${{ env.SOURCE_SHA }}
          path: UIRenderArtifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Chinese owned-view render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-chinese-view-renders-${{ env.SOURCE_SHA }}
          path: ChineseUIRenderArtifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-results-${{ env.SOURCE_SHA }}
          path: |
            TestResults.xcresult
            CatalogConcurrencyResults.txt
            InstallerIdleResults.xcresult
            InstallerFixtureEvidence/
            ProcessFixtureEvidence/
            ChineseRenderResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  release-tests:
    name: Release tests (${{ matrix.instrumentation }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        instrumentation: [none, address-sanitizer]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TEST_RUNNER_MOEKIT_INSTALLER_MOUNT_FIXTURE: '1'
      TEST_RUNNER_MOEKIT_INSTALLER_TRASH_FIXTURE: '1'
      TEST_RUNNER_MOEKIT_GIT_NATIVE_FIXTURE: '1'
      TEST_RUNNER_GITHUB_ACTIONS: 'true'
      TEST_RUNNER_RUNNER_ENVIRONMENT: github-hosted
      TEST_RUNNER_MOEKIT_INSTALLER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_RUNNER_MOEKIT_INSTALLER_EVIDENCE_DIR: ${{ github.workspace }}/InstallerFixtureEvidence
      TEST_RUNNER_MOEKIT_PROCESS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_RUNNER_MOEKIT_PROCESS_EVIDENCE_DIR: ${{ github.workspace }}/ProcessFixtureEvidence
      INSTRUMENTATION: ${{ matrix.instrumentation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.3.10'
      - name: Prepare pinned Mole analyzer for optimized synthetic fixture tests
        if: matrix.instrumentation == 'none'
        run: python3 Scripts/prepare-mole-ci-fixture.py
      - name: Verify exact source and generate workspace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tuist version)" = '4.148.3'
          xcodebuild -version
          swift --version
          tuist generate --no-open
      - name: Build and test optimized Release without signing secrets
        run: |
          set -euo pipefail
          args=(-workspace MoeKit.xcworkspace -scheme MoeKit -configuration Release
                -destination 'platform=macOS' -derivedDataPath DerivedDataRelease
                ENABLE_TESTABILITY=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          test_args=(test-without-building -testLanguage en -testRegion US -resultBundlePath ReleaseTestResults.xcresult
                     '-skip-testing:MoeKitTests/InstallerUseEvidenceTests/nativeIdleCurrentUserCoverage()')
          if [ "$INSTRUMENTATION" = address-sanitizer ]; then
            args+=(-enableAddressSanitizer YES)
            test_args+=(-only-testing:MoeKitTests/CatalogPersistenceTests
                        -only-testing:MoeKitTests/WorkspacePersistenceTests
                        -only-testing:MoeKitTests/CatalogRecoveryLifetimeTests
                        -only-testing:MoeKitTests/CatalogWriteCoordinatorTests
                        -only-testing:MoeKitTests/AnchoredDirectoryTests
                        -only-testing:MoeKitTests/RepositoryScannerTests
                        -only-testing:MoeKitTests/BoundedRegularFileReaderTests
                        -only-testing:MoeKitTests/WorkspaceOperationPrivacyTests
                        -only-testing:MoeKitTests/ToolPreparationTests
                        -only-testing:MoeKitTests/ToolPreparationStoreTests
                        -only-testing:MoeKitTests/MoleAnalysisModelsTests
                        -only-testing:MoeKitTests/MoleAnalysisFilesTests
                        -only-testing:MoeKitTests/MoleAnalysisStoreTests
                        -only-testing:MoeKitTests/InstallerFileAccessTests
                        -only-testing:MoeKitTests/InstallerTrashExecutorTests
                        -only-testing:MoeKitTests/InstallerUseEvidenceTests
                        -only-testing:MoeKitTests/InstallerTrashStoreTests
                        -only-testing:MoeKitTests/GitPlainIndexTests
                        -only-testing:MoeKitTests/GitCleanupInspectionTests
                        -only-testing:MoeKitTests/GitCleanupAuthorityTests
                        -only-testing:MoeKitTests/GitCleanupExecutorTests
                        -only-testing:MoeKitTests/ProcessTerminationTests
                        -only-testing:MoeKitTests/ProcessTerminationStoreTests
                        -only-testing:MoeKitTests/NativeProcessTerminationTests)
          fi
          xcodebuild -project MoeKit.xcodeproj -alltargets -configuration Release \
            ENABLE_TESTABILITY=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -showBuildSettings -json > ReleaseBuildSettings.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          settings = json.loads(Path("ReleaseBuildSettings.json").read_text())
          levels = {entry["target"]: entry["buildSettings"].get("SWIFT_OPTIMIZATION_LEVEL") for entry in settings}
          required = ("MoeKit", "MoeKitTests")
          if any(levels.get(target) not in {"-O", "-Osize"} for target in required):
              raise SystemExit(f"Release app and tests must stay optimized: {levels}")
          print(f"Verified Release optimization levels: {levels}")
          PY
          mkdir -m 700 InstallerFixtureEvidence ProcessFixtureEvidence
          xcodebuild "${args[@]}" build-for-testing
          xcodebuild "${args[@]}" "${test_args[@]}"
          python3 Scripts/verify-process-fixture-evidence.py --directory ProcessFixtureEvidence --source-sha "$SOURCE_SHA"
          if [ "$INSTRUMENTATION" = none ]; then
            python3 Scripts/verify-installer-fixture-evidence.py --directory InstallerFixtureEvidence --source-sha "$SOURCE_SHA" --kinds native-trash mounted-image live-mole
          fi
          xcrun xcresulttool get test-results summary --path ReleaseTestResults.xcresult > ReleaseTestSummary.json
          xcrun xcresulttool get test-results tests --path ReleaseTestResults.xcresult > ReleaseTestInventory.json
          python3 - <<'PYTHON'
          from pathlib import Path
          import json
          summary = json.loads(Path("ReleaseTestSummary.json").read_text())
          inventory = Path("ReleaseTestInventory.json").read_text()
          json.loads(inventory)
          required = ("CatalogPersistenceTests", "WorkspacePersistenceTests", "CatalogRecoveryLifetimeTests",
                      "AnchoredDirectoryTests", "RepositoryScannerTests", "BoundedRegularFileReaderTests",
                      "CatalogWriteCoordinatorTests", "WorkspaceOperationPrivacyTests",
                      "ToolPreparationTests", "ToolPreparationStoreTests",
                      "MoleAnalysisModelsTests", "MoleAnalysisFilesTests", "MoleAnalysisStoreTests",
                      "InstallerFileAccessTests", "InstallerTrashExecutorTests", "InstallerUseEvidenceTests", "InstallerTrashStoreTests",
                      "GitPlainIndexTests", "GitCleanupInspectionTests", "GitCleanupAuthorityTests", "GitCleanupExecutorTests",
                      "ProcessTerminationTests", "ProcessTerminationStoreTests", "NativeProcessTerminationTests")
          if summary.get("passedTests", 0) < 27 or summary.get("failedTests") != 0 or summary.get("skippedTests") != 0:
              raise SystemExit(f"Optimized catalog tests must execute and pass without skips: {summary}")
          if any(suite not in inventory for suite in required):
              raise SystemExit("An expected catalog suite is absent from the executed test inventory")
          print(f"Verified executed optimized suites: {required}; passed: {summary['passedTests']}")
          PYTHON
      - name: Verify optimized native catalog writer concurrency
        run: |
          set -euo pipefail
          configuration=release
          if [ "$INSTRUMENTATION" = address-sanitizer ]; then configuration=asan; fi
          python3 Scripts/test-catalog-concurrency.py --configuration "$configuration" | tee CatalogConcurrencyResults.txt
      - name: Preserve optimized test results and build settings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results-${{ matrix.instrumentation }}-${{ env.SOURCE_SHA }}
          path: |
            ReleaseTestResults.xcresult
            ReleaseBuildSettings.json
            ReleaseTestSummary.json
            ReleaseTestInventory.json
            CatalogConcurrencyResults.txt
            InstallerIdleResults.xcresult
            InstallerFixtureEvidence/
            ProcessFixtureEvidence/
          if-no-files-found: ignore
          retention-days: 14
